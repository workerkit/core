name: Publish

# Tag-driven npm publish with provenance. Auth is npm "trusted publishing" (OIDC): configure the
# @workerkit/core package on npmjs.com to trust this repository + this workflow file, and no npm
# token ever exists. The id-token permission below is what mints the OIDC credential.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # gh release create
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # OIDC trusted publishing needs npm >= 11.5.1; Node 22 still bundles npm 10.x, which
      # silently falls back to the legacy token flow and fails with ENEEDAUTH.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm publish --provenance --access public
      # The version is on npm; record it on GitHub too, with the matching CHANGELOG section as
      # the notes, so the Releases page tracks what npm serves instead of needing a manual step.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > release-notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --latest --verify-tag
